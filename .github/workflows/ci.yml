name: Validate paper platform
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: npm test && npm run check
      - run: alembic upgrade head && alembic check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optionlab_ci
          POSTGRES_USER: postgres
          # Disposable CI container only. Never use trust authentication in deployment.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optionlab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPTIONLAB_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/optionlab_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q tests/test_postgres.py
